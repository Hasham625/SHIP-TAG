<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SHIP-TAG | Reset Password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'serif'; }
        body { background-color: #ffffff; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .auth-card {
            background: #ffffff;
            width: 450px;
            padding: 60px 40px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .title { color: #1e457e; font-size: 32px; font-weight: bold; margin-bottom: 40px; }

        .input-group { width: 80%; margin: 0 auto 30px auto; text-align: left; }
        .underline-input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #000;
            padding: 10px 0;
            font-size: 15px;
            outline: none;
        }

        .btn-pill {
            background-color: #1e457e;
            color: white;
            border: none;
            padding: 12px 60px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s ease;
        }

        .btn-pill:hover { background-color: #14325c; }

        .error-message { color: #d32f2f; font-size: 14px; margin-bottom: 20px; text-align: left; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2 class="title">Reset Password</h2>

        <form method="POST" action="">
            {% csrf_token %}
            {% if error %}
                <p class="error-message">{{ error }}</p>
            {% endif %}
            <div class="input-group">
                <input type="password" name="password" placeholder="Enter New Password" class="underline-input" required>
            </div>
            <div class="input-group">
                <input type="password" name="confirm_password" placeholder="Confirm Password" class="underline-input" required>
            </div>
            <button type="submit" class="btn-pill">Continue</button>
        </form>
    </div>
</body>
</html>
