<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SHIP-TAG | Manage Devices</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --brand-blue: #1e3a8a; 
            --header-blue: #003366;
            --bg-gray: #e5e7eb;
            --sidebar-active: #dbeafe;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-gray); height: 100vh; overflow: hidden; }

        header {
            background-color: var(--header-blue);
            color: white;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logout-btn {
            background: transparent;
            color: white;
            border: 1.5px solid white;
            padding: 8px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .main-layout { display: flex; height: calc(100vh - 70px); padding: 20px; gap: 20px; }

        .sidebar {
            width: 260px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .nav-item {
            padding: 15px;
            margin-bottom: 5px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: #4b5563;
            text-decoration: none;
        }

        .nav-item.active {
            background-color: var(--sidebar-active);
            color: var(--header-blue);
        }

        .content-card {
            flex: 1;
            background: white;
            border-radius: 30px;
            padding: 40px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .btn-add {
            background: var(--header-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #6b7280; border-bottom: 1px solid #f3f4f6; }
        td { padding: 20px 15px; border-bottom: 1px solid #f3f4f6; }

        .status-online { color: #059669; font-weight: 700; }
        .status-offline { color: #dc2626; font-weight: 700; }

        .action-link {
            color: #1e3a8a;
            font-weight: 800;
            text-decoration: none;
        }

        /* Drawer */
        .drawer-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            display: none;
        }

        .drawer-overlay.active { display: block; }

        .side-drawer {
            position: absolute;
            right: 0;
            top: 0;
            width: 450px;
            height: 100%;
            background: white;
            padding: 40px;
        }

        .input-box { margin-bottom: 20px; }
        .input-box label { display: block; margin-bottom: 8px; font-weight: 700; }
        .input-box input, .input-box select {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
        }

        .btn-register {
            background: #3f51b5;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Ship Tag Logo</h1>
    <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
</header>

<div class="main-layout">

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="{% url 'dashboard' %}" class="nav-item">
            <i class="fa-solid fa-chart-line"></i> Dashboard
        </a>
        <a href="{% url 'manage_devices' %}" class="nav-item active">
            <i class="fa-solid fa-microchip"></i> Manage Devices
        </a>
    </div>

    <!-- Content -->
    <div class="content-card">

        <div class="card-header">
            <h2 style="color: var(--header-blue);">Manage Devices</h2>
            <button class="btn-add" onclick="toggleDrawer()">
                <i class="fa-solid fa-plus"></i> Add Device
            </button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Device ID</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for device in devices %}
                <tr>
                    <td>#{{ device.id }}</td>
                    <td>{{ device.type }}</td>
                    <td class="{% if device.status == 'Online' %}status-online{% else %}status-offline{% endif %}">
                        {{ device.status }}
                    </td>
                    <td>
                        <a href="{% url 'device_details' device.id %}" class="action-link">
                            View detail
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4">No devices found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>
</div>

<!-- Drawer -->
<div class="drawer-overlay" id="drawerOverlay">
    <div class="side-drawer">
        <h2>Add New Device</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="input-box">
                <label>Device Type</label>
                <select name="device_type">
                    <option>GPS Tracker Pro v2</option>
                    <option>Temperature Sensor</option>
                </select>
            </div>

            <div class="input-box">
                <label>Serial Number / ID</label>
                <input type="text" name="serial_number" required>
            </div>

            <div class="input-box">
                <label>Min Temp</label>
                <input type="number" name="min_temp">
            </div>

            <div class="input-box">
                <label>Max Temp</label>
                <input type="number" name="max_temp">
            </div>

            <button type="submit" name="register_device" class="btn-register">
                Register Device
            </button>
        </form>

    </div>
</div>

<script>
    function toggleDrawer() {
        document.getElementById('drawerOverlay').classList.toggle('active');
    }
</script>

</body>
</html>
