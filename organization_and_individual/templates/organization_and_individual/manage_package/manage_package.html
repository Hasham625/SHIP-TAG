<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIP-TAG | Manage Packages</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --brand-blue: #2d3e7d; 
            --header-blue: #004d80;
            --bg-gray: #d9d9d9;
            --input-border: #e2e8f0;
            --accent-cyan: #00aeef; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s ease; }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-gray);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--header-blue);
            color: white; padding: 12px 30px;
            display: flex; justify-content: space-between; align-items: center;
            height: 60px; width: 100%; flex-shrink: 0;
        }

        .btn-logout {
            background: transparent; color: white; border: 2px solid white;
            padding: 6px 20px; border-radius: 12px; font-weight: 500; cursor: pointer;
        }

        .main-container { 
            display: flex; flex: 1; padding: 20px; gap: 20px; 
            width: 100%; height: calc(100vh - 60px); overflow: hidden; 
        }
        
        .sidebar { 
            width: 280px; background: white; border-radius: 15px; padding: 20px; 
            display: flex; flex-direction: column; flex-shrink: 0;
        }

        .nav-item { 
            padding: 12px 15px; margin-bottom: 10px; border-radius: 5px; 
            color: #004d80; font-weight: 600; display: flex; align-items: center; gap: 10px; text-decoration: none;
        }
        .nav-item.active-nav { background-color: #d1e8ff; }

        .content-view { flex: 1; overflow-y: auto; }
        .management-card { 
            background: white; border-radius: 20px; padding: 30px; 
            min-height: 100%; box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }

        .manage-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-action-blue { 
            background-color: var(--header-blue); color: white; border: none; 
            padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; 
            display: flex; align-items: center; gap: 8px; 
        }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; border-bottom: 2px solid #f1f5f9; color: #64748b; font-weight: 600; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
        .status-active { color: #2e7d32; font-weight: bold; }
        .view-link { color: var(--brand-blue); text-decoration: none; font-size: 14px; font-weight: 600; }

        /* --- CENTERED MODAL STYLES --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2000;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .fancy-modal {
            background: white; width: 450px; padding: 35px; border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--brand-blue); }
        .form-group input { 
            width: 100%; padding: 12px; border: 1.5px solid var(--input-border); 
            border-radius: 12px; outline: none; 
        }
        .btn-submit { 
            background: var(--header-blue); color: white; border: none; 
            padding: 15px; width: 100%; border-radius: 12px; font-weight: 600; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="modal-overlay" id="addPackageModal">
        <div class="fancy-modal">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 style="color: var(--brand-blue);">Add Package</h2>
                <i class="fa-solid fa-xmark" style="cursor: pointer; font-size: 20px;" onclick="closeModal()"></i>
            </div>
            
            <div class="form-group">
                <label>Package ID</label>
                <input type="text" value="#PKG-NEW" readonly style="background: #f1f5f9; color: #64748b;">
            </div>
            <div class="form-group">
                <label>From</label>
                <input type="text" placeholder="e.g. London, UK">
            </div>
            <div class="form-group">
                <label>Destination</label>
                <input type="text" placeholder="e.g. Karachi, Pakistan">
            </div>
            
            <button class="btn-submit" onclick="closeModal()">Create Package</button>
        </div>
    </div>

    <header>
        <h2 style="font-weight: 800;">Ship Tag Logo</h2>
        <button class="btn-logout">Logout</button>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <a href="#" class="nav-item"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-users"></i> Manage Users</a>
            <a href="#" class="nav-item active-nav"><i class="fa-solid fa-box"></i> Manage Packages</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-microchip"></i> Manage Devices</a>
            <a href="#" class="nav-item"><i class="fa-solid fa-user-circle"></i> My Profile</a>
            <div style="margin-top:auto;">
                <h3 style="color: #004d80; font-size: 24px; margin-bottom: 10px;">Need Help ?</h3>
                <button style="background:#004d80; color:white; width:100%; padding:12px; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">Chat With Us</button>
            </div>
        </div>

        <div class="content-view">
            <div class="management-card">
                <div class="manage-header">
                    <h2 style="color: var(--header-blue);">Manage Packages</h2>
                    <button class="btn-action-blue" onclick="openModal()"><i class="fa-solid fa-plus"></i> Add Package</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Package ID</th>
                            <th>From</th>
                            <th>Destination</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>#PKG-9920</td>
                            <td>London, UK</td>
                            <td>Karachi, Pakistan</td>
                            <td class="status-active">In Transit</td>
                            <td><a href="package_detail.html" class="view-link">View Details</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('addPackageModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('addPackageModal').style.display = 'none'; }
        
        // Close modal when clicking on the dark area
        window.onclick = function(event) {
            let modal = document.getElementById('addPackageModal');
            if (event.target == modal) { closeModal(); }
        }
    </script>
</body>
</html>
