{% load static %}
<!DOCTYPE html>
<html lang="en">

{% include 'head.html' %}

<body>
  <!-- Preloader -->
  <div id="preloader">
    <div data-loader="dual-ring"></div>
  </div>
  <!-- Preloader End -->

  <div id="main-wrapper">
    <div id="content" class="py-4">
      <div class="container1">
        <div class="row mt-2">
          <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-12">
            <div class="ibox">
              <div class="ibox-title">
                <h5 class="clr-wht">Add Package</h5>
              </div>
              <div class="ibox-content-editpro">
                <form method="POST" action="{% url 'add_package' %}">
                  {% csrf_token %}

                  <!-- Package Name -->
                  <div class="mb-2">
                    <div class="col-md-12 fv-row">
                      <div class="row">
                        <div class="col-md-4 col-lg-4 col-xl-4 col-sm-12 col-xs-12">
                          <label class="required fs-7 fw-500 mb-2 valign-sub">Package Name :</label>
                        </div>
                        <div class="col-md-8 col-lg-8 col-xl-8 col-sm-12 col-xs-12">
                          <input
                            type="text"
                            name="package_name"
                            class="form-control bg-transparent border-1"
                            placeholder="Enter package name"
                            required
                          />
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- From -->
                  <div class="mb-2">
                    <div class="col-md-12 fv-row">
                      <div class="row">
                        <div class="col-md-4 col-lg-4 col-xl-4 col-sm-12 col-xs-12">
                          <label class="required fs-7 fw-500 mb-2 valign-sub">From :</label>
                        </div>
                        <div class="col-md-8 col-lg-8 col-xl-8 col-sm-12 col-xs-12">
                          <input
                            type="text"
                            name="from_location"
                            class="form-control bg-transparent border-1"
                            placeholder="Enter origin location"
                            required
                          />
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Destination -->
                  <div class="mb-2">
                    <div class="col-md-12 fv-row">
                      <div class="row">
                        <div class="col-md-4 col-lg-4 col-xl-4 col-sm-12 col-xs-12">
                          <label class="required fs-7 fw-500 mb-2 valign-sub">Destination :</label>
                        </div>
                        <div class="col-md-8 col-lg-8 col-xl-8 col-sm-12 col-xs-12">
                          <input
                            type="text"
                            name="destination"
                            class="form-control bg-transparent border-1"
                            placeholder="Enter destination"
                            required
                          />
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Amount -->
                  <div class="mb-2">
                    <div class="col-md-12 fv-row">
                      <div class="row">
                        <div class="col-md-4 col-lg-4 col-xl-4 col-sm-12 col-xs-12">
                          <label class="required fs-7 fw-500 mb-2 valign-sub">Amount :</label>
                        </div>
                        <div class="col-md-8 col-lg-8 col-xl-8 col-sm-12 col-xs-12">
                          <input
                            type="number"
                            name="amount"
                            class="form-control bg-transparent border-1"
                            placeholder="Enter amount"
                            required
                          />
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Status -->
                  <div class="mb-2">
                    <div class="col-md-12 fv-row">
                      <div class="row">
                        <div class="col-md-4 col-lg-4 col-xl-4 col-sm-12 col-xs-12">
                          <label class="required fs-7 fw-500 mb-2 valign-sub">Status :</label>
                        </div>
                        <div class="col-md-8 col-lg-8 col-xl-8 col-sm-12 col-xs-12">
                          <select name="status" id="status" class="form-select bg-transparent border-1 widt">
                            <option value="" disabled selected>Select Status</option>
                            <option value="In Transit">In Transit</option>
                            <option value="Delivered">Delivered</option>
                            <option value="Pending">Pending</option>
                            <option value="Cancelled">Cancelled</option>
                          </select>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Buttons -->
                  <div class="row mb-2">
                    <div class="col-md-12">
                      <button type="submit" class="view-more-button" style="margin-left: 10px;">
                        Create
                      </button>
                      <a href="manage_packages.html" onclick="parent.jQuery.fancybox.close();"
                        class="back-more-button">Back</a>
                    </div>
                  </div>

                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
  <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'vendor/bootstrap-select/js/bootstrap-select.min.js' %}"></script>
  <script src="{% static 'js/switcher.min.js' %}"></script>
  <script src="{% static 'js/theme.js' %}"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

</body>
</html>
