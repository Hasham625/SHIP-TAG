<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIP-TAG | Personal Information</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --header-blue: #004d80;
            --bg-gray: #d9d9d9;
            --btn-light-blue: #7cb9e8;
            --btn-dark-blue: #1b4d89;
            --success-green: #3a7d44;
            --label-blue: #1b4d89;
            --text-gray: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-gray);
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--header-blue);
            color: white;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .btn-logout {
            background: transparent; color: white; border: 2px solid white;
            padding: 8px 25px; border-radius: 12px; font-weight: 500; cursor: pointer;
        }

        .main-container {
            flex: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
        }

        /* PERSONAL INFORMATION CARD */
        .profile-card { 
            background: white; 
            border-radius: 25px; 
            padding: 45px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            width: 100%;
            max-width: 1100px;
            min-height: 500px; 
        }
        
        .card-header-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
        }

        .card-header-row h2 { 
            color: var(--label-blue); 
            font-size: 28px; 
            font-weight: 800; 
        }
        
        .action-group { display: flex; gap: 12px; }

        .btn-card { 
            padding: 10px 22px; 
            border-radius: 10px; 
            border: none; 
            color: white; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 14px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .btn-edit { background-color: var(--btn-light-blue); }
        .btn-pwd { background-color: var(--btn-light-blue); }
        .btn-back { background-color: var(--btn-dark-blue); }

        /* TABS */
        .tabs { 
            display: flex; 
            gap: 35px; 
            border-bottom: 2px solid #f1f5f9; 
            margin-bottom: 40px; 
        }

        .tab { 
            padding-bottom: 12px; 
            font-weight: 800; 
            font-size: 16px; 
            color: #94a3b8; 
            cursor: pointer; 
            position: relative; 
        }

        .tab.active { color: var(--success-green); }

        .tab.active::after { 
            content: ''; 
            position: absolute; 
            bottom: -2px; 
            left: 0; 
            width: 100%; 
            height: 3px; 
            background: var(--success-green); 
            border-radius: 2px; 
        }

        /* DATA CONTENT SECTIONS */
        .info-content { display: none; }
        .info-content.active { display: grid; }

        .data-grid { 
            grid-template-columns: 250px 1fr; 
            gap: 25px; 
            align-items: center; 
        }

        .label { 
            font-weight: 800; 
            color: var(--label-blue); 
            font-size: 16px; 
        }

        .value { 
            color: var(--text-gray); 
            font-weight: 600; 
            font-size: 16px; 
        }

        .status-active { 
            color: var(--success-green); 
            font-weight: 800; 
        }

        /* FANCY MODAL STYLES */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-box {
            background: white; width: 400px; padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative;
        }

        .modal-box h3 { color: var(--label-blue); font-size: 22px; font-weight: 800; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; font-weight: 800; color: var(--label-blue); margin-bottom: 8px; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #e2e8f0; border-radius: 10px; outline: none; font-size: 14px; }
        .modal-footer { display: flex; gap: 10px; margin-top: 10px; }
        .btn-submit { flex: 1; background-color: var(--btn-dark-blue); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-cancel { flex: 1; background-color: #f1f5f9; color: var(--text-gray); border: none; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h2 style="font-weight: 800;">Ship Tag Logo</h2>
        <button class="btn-logout">Logout</button>
    </header>

    <div class="main-container">
        <div class="profile-card">
            <div class="card-header-row">
                <h2>Personal Information</h2>
                <div class="action-group">
                    <button class="btn-card btn-edit">Edit Profile</button>
                    <button class="btn-card btn-pwd" onclick="toggleModal(true)">Change Password</button>
                    <button class="btn-card btn-back" onclick="window.history.back()">
                        <i class="fa-solid fa-arrow-left"></i> Back
                    </button>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active" id="tab-gen" onclick="switchTab('gen')">General Information</div>
                <div class="tab" id="tab-addr" onclick="switchTab('addr')">Address Info</div>
            </div>

            <div class="info-content data-grid active" id="content-gen">
                <span class="label">User Id</span>
                <span class="value">#USR-001</span>

                <span class="label">Full Name</span>
                <span class="value">Admin User</span>

                <span class="label">Email Address</span>
                <span class="value">admin@shiptag.com</span>

                <span class="label">Account Status</span>
                <span class="value status-active">Active</span>
            </div>

            <div class="info-content data-grid" id="content-addr">
                <span class="label">Street Address</span>
                <span class="value">Plot 45, Industrial Zone</span>

                <span class="label">City</span>
                <span class="value">Karachi</span>

                <span class="label">Country</span>
                <span class="value">Pakistan</span>

                <span class="label">Postal Code</span>
                <span class="value">75500</span>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="pwdModal">
        <div class="modal-box">
            <h3>Update Password</h3>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" placeholder="••••••••">
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="toggleModal(false)">Cancel</button>
                <button class="btn-submit" onclick="toggleModal(false)">Update</button>
            </div>
        </div>
    </div>

    <script>
        function toggleModal(show) {
            document.getElementById('pwdModal').style.display = show ? 'flex' : 'none';
        }

        function switchTab(tabName) {
            // Remove active class from all tabs
            document.getElementById('tab-gen').classList.remove('active');
            document.getElementById('tab-addr').classList.remove('active');
            // Hide all content
            document.getElementById('content-gen').classList.remove('active');
            document.getElementById('content-addr').classList.remove('active');

            // Add active to selected
            if (tabName === 'gen') {
                document.getElementById('tab-gen').classList.add('active');
                document.getElementById('content-gen').classList.add('active');
            } else {
                document.getElementById('tab-addr').classList.add('active');
                document.getElementById('content-addr').classList.add('active');
            }
        }
    </script>

</body>
</html>
