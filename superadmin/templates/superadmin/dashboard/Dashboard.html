<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIP-TAG | Secure Tracking System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --brand-blue: #2d3e7d; 
            --header-blue: #004d80;
            --bg-gray: #d9d9d9;
            --input-border: #e2e8f0;
            --accent-cyan: #00aeef; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s ease; }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            overflow: hidden;
        }

        .page { display: none; height: 100vh; width: 100%; justify-content: center; align-items: center; }
        
        .active { display: flex; }

        .dashboard-layout { flex-direction: column; background-color: var(--bg-gray); justify-content: flex-start; }
        
        header {
            background-color: var(--header-blue);
            color: white;
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .btn-logout {
            background: transparent; color: white; border: 2px solid white;
            padding: 8px 25px; border-radius: 12px; font-weight: 500; cursor: pointer;
        }

        .main-container { display: flex; flex: 1; padding: 20px; gap: 20px; width: 100%; overflow: hidden; }
        
        .sidebar { width: 280px; background: white; border-radius: 15px; padding: 20px; display: flex; flex-direction: column; }
        .nav-item { padding: 12px 15px; margin-bottom: 10px; border-radius: 5px; color: #004d80; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        
        .nav-item.active-nav { background-color: #d1e8ff; cursor: pointer; }
        
        .nav-item.disabled-nav { 
            opacity: 0.4; 
            cursor: not-allowed; 
            pointer-events: none; 
        }

        .content-view { flex: 1; display: none; overflow-y: auto; padding-right: 10px; }
        .content-view.active-view { display: block; }

        .content-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 20px; padding: 25px; height: 140px; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .stat-value { position: absolute; bottom: 20px; right: 25px; font-size: 24px; font-weight: 800; color: #000; }

        .dashboard-flex-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .dashboard-full-row { width: 100%; margin-bottom: 20px; }

        .flex-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex: 1; min-height: 300px; display: flex; flex-direction: column; }
        .flex-card h3 { color: #000; font-size: 18px; margin-bottom: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .placeholder-box { flex: 1; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; position: relative; }
    </style>
</head>
<body>

    <div id="dashboard-layout" class="page active dashboard-layout">
        <header>
            <h2 style="font-weight: 800;">Ship Tag Logo</h2>
            <button class="btn-logout">Logout</button>
        </header>

        <div class="main-container">
            <div class="sidebar">
                <div class="nav-item active-nav">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </div>
                <div class="nav-item disabled-nav">
                    <i class="fa-solid fa-users"></i> Manage Users
                </div>
                <div class="nav-item disabled-nav">
                    <i class="fa-solid fa-box"></i> Manage Packages
                </div>
                <div class="nav-item disabled-nav">
                    <i class="fa-solid fa-microchip"></i> Manage Devices
                </div>
                <div class="nav-item disabled-nav">
                    <i class="fa-solid fa-user-circle"></i> My Profile
                </div>
            </div>

            <div id="dashboard-view" class="content-view active-view">
                <div class="content-grid">
                    <div class="stat-card"><b>Total Devices</b><span class="stat-value">2000</span></div>
                    <div class="stat-card"><b>Total Packages</b><span class="stat-value">3000</span></div>
                    <div class="stat-card"><b>Warnings</b><span class="stat-value">5</span></div>
                    <div class="stat-card"><b>Active Devices</b><span class="stat-value">1222</span></div>
                    <div class="stat-card"><b>Offline Devices</b><span class="stat-value">778</span></div>
                    <div class="stat-card"><b>New Alerts</b><span class="stat-value">12</span></div>
                </div>

                <div class="dashboard-flex-row">
                    <div class="flex-card">
                        <h3>Recently Active Devices</h3>
                        <div class="placeholder-box"></div>
                    </div>
                    <div class="flex-card">
                        <h3>Recently Added Users</h3>
                        <div class="placeholder-box"></div>
                    </div>
                </div>

                <div class="dashboard-full-row">
                    <div class="flex-card" style="min-height: 400px;">
                        <h3>Devices Location</h3>
                        <div class="placeholder-box">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/e/ec/World_map_blank_without_borders.svg" style="width:100%; height:100%; object-fit: contain; opacity: 0.2;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
