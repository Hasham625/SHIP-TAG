<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SHIP-TAG | Enter OTP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'serif'; }
        body { background-color: #ffffff; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .auth-card {
            background: #ffffff;
            width: 450px;
            padding: 60px 40px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .title { color: #1e457e; font-size: 32px; font-weight: bold; margin-bottom: 15px; }
        .subtitle { color: #333; font-size: 15px; margin-bottom: 40px; }

        .otp-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; }
        .otp-input {
            width: 45px;
            height: 45px;
            border: 1px solid #999;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            outline: none;
        }

        .btn-pill {
            background-color: #1e457e;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.3s ease;
        }

        .btn-pill:hover { background-color: #14325c; }

        .back-link { display: block; color: #1e457e; text-decoration: none; font-size: 14px; font-weight: bold; }

        .error-message { color: #d32f2f; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="auth-card">
        {% if messages %}
            {% for message in messages %}
                <div class="error-message">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <h2 class="title">Enter OTP</h2>
        <p class="subtitle">Please enter the OTP sent to your email.</p>

        <form method="POST" action="">
            {% csrf_token %}
            {% if error %}
                <p class="error-message">{{ error }}</p>
            {% endif %}
            <div class="otp-container">
        <input type="text" maxlength="1" class="otp-input" name="otp1" required>
        <input type="text" maxlength="1" class="otp-input" name="otp2" required>
        <input type="text" maxlength="1" class="otp-input" name="otp3" required>
        <input type="text" maxlength="1" class="otp-input" name="otp4" required>
        <input type="text" maxlength="1" class="otp-input" name="otp5" required>
        <input type="text" maxlength="1" class="otp-input" name="otp6" required>
    </div>
            <button type="submit" class="btn-pill">Confirm OTP</button>
        </form>

        <a href="{% url 'login_user' %}" class="back-link">Back to Login</a>
    </div>

    <script>
        // Auto-focus next input on keypress
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
        });
    </script>
</body>
</html>
